<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>小兔与恐龙 · 喂食小游戏</title>
  <style>
    :root {
      --bg1: #ffe8f3;
      --bg2: #e8f7ff;
      --pastel-pink: #ffb6d5;
      --pastel-mint: #b8f0d8;
      --pastel-yellow: #ffe9a8;
      --pastel-lilac: #d9c7ff;
      --text: #5a4a6a;
      --card: rgba(255, 255, 255, 0.78);
      --shadow: 0 10px 28px rgba(120, 90, 140, 0.18);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(165deg, var(--bg1), var(--bg2) 55%, #fff6e8);
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 100dvh;
    }

    #app {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(14px + var(--safe-bottom));
      position: relative;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .score-pill {
      background: var(--card);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: var(--shadow);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stage {
      flex: 1;
      position: relative;
      border-radius: 28px;
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.9), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(255, 230, 160, 0.45), transparent 35%),
        linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.25));
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 420px;
    }

    .sky-dots {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 22%, rgba(255,255,255,0.9) 0 6px, transparent 7px),
        radial-gradient(circle at 78% 18%, rgba(255,255,255,0.75) 0 5px, transparent 6px),
        radial-gradient(circle at 55% 10%, rgba(255,255,255,0.65) 0 4px, transparent 5px);
      opacity: 0.9;
    }

    .animals {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18%;
      display: flex;
      justify-content: space-around;
      padding: 0 8px;
      gap: 8px;
      z-index: 2;
    }

    .animal {
      width: 42%;
      max-width: 160px;
      aspect-ratio: 1;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease;
      position: relative;
    }

    .animal.bunny {
      background: linear-gradient(180deg, #fff7fb, #ffe0ef);
      border: 3px solid #ffc2db;
    }

    .animal.dino {
      background: linear-gradient(180deg, #f0fff8, #c9f7e0);
      border: 3px solid #9fe6c4;
    }

    .animal.happy {
      animation: bounceHappy 0.55s ease;
    }

    .animal.glow-ok {
      box-shadow: 0 0 0 6px rgba(120, 220, 160, 0.45), var(--shadow);
    }

    .animal.glow-no {
      box-shadow: 0 0 0 6px rgba(255, 180, 180, 0.35), var(--shadow);
    }

    .face {
      font-size: clamp(3.2rem, 16vw, 4.6rem);
      line-height: 1;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,0.04));
    }

    .label {
      font-size: 0.95rem;
      font-weight: 700;
      opacity: 0.85;
    }

    .hint {
      position: absolute;
      left: 50%;
      top: 10%;
      transform: translateX(-50%);
      background: var(--card);
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      font-weight: 700;
      font-size: 1rem;
      z-index: 3;
      white-space: nowrap;
    }

    .food-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
    }

    .food {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 8px 18px rgba(100, 80, 120, 0.2);
      cursor: grab;
      touch-action: none;
      transition: transform 0.12s ease;
      z-index: 5;
    }

    .food:active, .food.dragging {
      transform: scale(1.12);
      cursor: grabbing;
      z-index: 10;
    }

    .food.carrot {
      border: 3px solid #ffd1a8;
    }

    .food.leaf {
      border: 3px solid #b7ebc8;
    }

    .fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .heart, .spark {
      position: absolute;
      font-size: 1.6rem;
      animation: floatUp 0.9s ease-out forwards;
    }

    .celebrate {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.35);
      z-index: 30;
      backdrop-filter: blur(2px);
    }

    .celebrate.show {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .celebrate-card {
      background: white;
      border-radius: 28px;
      padding: 22px 26px;
      box-shadow: var(--shadow);
      text-align: center;
      max-width: 86%;
    }

    .celebrate-card .big {
      font-size: 2.6rem;
      margin-bottom: 6px;
    }

    .celebrate-card .msg {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .celebrate-card .sub {
      font-size: 0.95rem;
      opacity: 0.75;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 246, 252, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      backdrop-filter: blur(4px);
    }

    .overlay.hidden {
      display: none;
    }

    .panel {
      width: min(88%, 320px);
      background: white;
      border-radius: 28px;
      padding: 26px 22px 22px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .panel h1 {
      margin: 0 0 8px;
      font-size: 1.55rem;
    }

    .panel p {
      margin: 0 0 18px;
      line-height: 1.5;
      font-size: 0.98rem;
      opacity: 0.85;
    }

    .chars {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 2.8rem;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 1.15rem;
      font-weight: 800;
      color: #5a3d5c;
      background: linear-gradient(180deg, #ffe6f2, #ffcfe4);
      box-shadow: 0 8px 0 #f3a9c8, 0 12px 20px rgba(180, 100, 140, 0.2);
      cursor: pointer;
      min-width: 160px;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #f3a9c8, 0 8px 14px rgba(180, 100, 140, 0.18);
    }

    .btn.mint {
      background: linear-gradient(180deg, #e4fff3, #c7f5df);
      box-shadow: 0 8px 0 #95d9b8, 0 12px 20px rgba(80, 140, 120, 0.18);
      color: #2f5a4a;
    }

    .footer-note {
      text-align: center;
      margin-top: 10px;
      font-size: 0.82rem;
      opacity: 0.65;
    }

    @keyframes bounceHappy {
      0% { transform: scale(1) translateY(0); }
      30% { transform: scale(1.08) translateY(-10px); }
      55% { transform: scale(0.98) translateY(2px); }
      100% { transform: scale(1) translateY(0); }
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (min-height: 760px) {
      .stage { min-height: 520px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="top-bar">
      <div class="title">🐰 小兔与恐龙 🦕</div>
      <div class="score-pill" aria-live="polite">❤️ <span id="score">0</span></div>
    </div>

    <div class="stage" id="stage">
      <div class="sky-dots"></div>
      <div class="hint" id="hint">把食物送给好朋友～</div>

      <div class="animals">
        <div class="animal bunny" id="bunny" data-kind="bunny">
          <div class="face" aria-hidden="true">🐰</div>
          <div class="label">喂小兔</div>
        </div>
        <div class="animal dino" id="dino" data-kind="dino">
          <div class="face" aria-hidden="true">🦕</div>
          <div class="label">喂恐龙</div>
        </div>
      </div>

      <div class="food-layer" id="foodLayer"></div>
      <div class="fx-layer" id="fxLayer"></div>

      <div class="celebrate" id="celebrate">
        <div class="celebrate-card">
          <div class="big">🎉🐰🦕✨</div>
          <div class="msg">好棒呀！</div>
          <div class="sub">小兔和小恐龙都好开心</div>
        </div>
      </div>

      <div class="overlay" id="startOverlay">
        <div class="panel">
          <div class="chars"><span>🐰</span><span>🥕</span><span>🦕</span><span>🍃</span></div>
          <h1>喂小兔 · 喂恐龙</h1>
          <p>把胡萝卜给小兔<br>把叶子给恐龙<br>轻轻点一点、拖一拖就好</p>
          <button class="btn" id="startBtn" type="button">开始</button>
        </div>
      </div>

      <div class="overlay hidden" id="againOverlay">
        <div class="panel">
          <div class="chars"><span>💖</span><span>🐰</span><span>🦕</span></div>
          <h1>玩得开心吗？</h1>
          <p>想继续的话，再喂一次好朋友吧</p>
          <button class="btn mint" id="againBtn" type="button">再玩一次</button>
        </div>
      </div>
    </div>

    <div class="footer-note">适合 3 岁左右 · 轻轻玩就好</div>
  </div>

  <script>
    (function () {
      const foodLayer = document.getElementById("foodLayer");
      const fxLayer = document.getElementById("fxLayer");
      const stage = document.getElementById("stage");
      const bunny = document.getElementById("bunny");
      const dino = document.getElementById("dino");
      const scoreEl = document.getElementById("score");
      const hintEl = document.getElementById("hint");
      const celebrate = document.getElementById("celebrate");
      const startOverlay = document.getElementById("startOverlay");
      const againOverlay = document.getElementById("againOverlay");
      const startBtn = document.getElementById("startBtn");
      const againBtn = document.getElementById("againBtn");

      const animals = { bunny, dino };
      const kinds = ["bunny", "dino"];
      const foodEmoji = { bunny: "🥕", dino: "🍃" };
      const foodClass = { bunny: "carrot", dino: "leaf" };
      const hints = {
        bunny: "喂小兔胡萝卜～",
        dino: "喂恐龙叶子～",
        both: "把食物送给好朋友～",
        yay: "真厉害！❤️"
      };

      let score = 0;
      let playing = false;
      let activeFood = null;
      let audioCtx = null;
      let celebrateTimer = null;

      function ensureAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(function () {});
        }
      }

      function tone(freq, dur, type, gainVal, delay) {
        if (!audioCtx) return;
        const t0 = audioCtx.currentTime + (delay || 0);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      }

      function playHappy() {
        ensureAudio();
        tone(523.25, 0.18, "sine", 0.11, 0);
        tone(659.25, 0.18, "sine", 0.11, 0.08);
        tone(783.99, 0.25, "triangle", 0.1, 0.16);
      }

      function playSoftNo() {
        ensureAudio();
        tone(280, 0.12, "triangle", 0.05, 0);
        tone(220, 0.16, "sine", 0.04, 0.08);
      }

      function playCelebrate() {
        ensureAudio();
        [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
          tone(f, 0.22, "sine", 0.1, i * 0.1);
        });
      }

      function playPop() {
        ensureAudio();
        tone(880, 0.08, "sine", 0.06, 0);
      }

      function setHint(text) {
        hintEl.textContent = text;
      }

      function spawnHearts(el) {
        const rect = el.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();
        for (let i = 0; i < 4; i++) {
          const h = document.createElement("div");
          h.className = "heart";
          h.textContent = ["💖", "✨", "💕", "⭐"][i % 4];
          const x = rect.left - stageRect.left + rect.width * (0.25 + Math.random() * 0.5);
          const y = rect.top - stageRect.top + rect.height * 0.25;
          h.style.left = x + "px";
          h.style.top = y + "px";
          h.style.animationDelay = (i * 0.05) + "s";
          fxLayer.appendChild(h);
          setTimeout(function () { h.remove(); }, 950);
        }
      }

      function flashAnimal(el, ok) {
        el.classList.remove("glow-ok", "glow-no", "happy");
        void el.offsetWidth;
        el.classList.add(ok ? "glow-ok" : "glow-no");
        if (ok) el.classList.add("happy");
        setTimeout(function () {
          el.classList.remove("glow-ok", "glow-no");
        }, 450);
      }

      function showCelebrate() {
        celebrate.classList.add("show");
        playCelebrate();
        clearTimeout(celebrateTimer);
        celebrateTimer = setTimeout(function () {
          celebrate.classList.remove("show");
        }, 1600);
      }

      function randomFoodKind() {
        return kinds[Math.floor(Math.random() * kinds.length)];
      }

      function placeFood(el) {
        const stageRect = stage.getBoundingClientRect();
        const size = 72;
        const pad = 12;
        const topMin = stageRect.height * 0.18;
        const topMax = stageRect.height * 0.42;
        const left = pad + Math.random() * (stageRect.width - size - pad * 2);
        const top = topMin + Math.random() * Math.max(20, topMax - topMin);
        el.style.left = left + "px";
        el.style.top = top + "px";
      }

      function clearFoods() {
        foodLayer.innerHTML = "";
        activeFood = null;
      }

      function spawnFood() {
        if (!playing) return;
        clearFoods();
        const kind = randomFoodKind();
        const el = document.createElement("div");
        el.className = "food " + foodClass[kind];
        el.dataset.kind = kind;
        el.textContent = foodEmoji[kind];
        el.setAttribute("role", "button");
        el.setAttribute("aria-label", kind === "bunny" ? "胡萝卜" : "叶子");
        placeFood(el);
        foodLayer.appendChild(el);
        bindFood(el);
        setHint(hints[kind]);
        playPop();
      }

      function hitTestAnimal(clientX, clientY) {
        for (const kind of kinds) {
          const el = animals[kind];
          const r = el.getBoundingClientRect();
          const pad = 12;
          if (
            clientX >= r.left - pad &&
            clientX <= r.right + pad &&
            clientY >= r.top - pad &&
            clientY <= r.bottom + pad
          ) {
            return kind;
          }
        }
        return null;
      }

      function successFeed(kind, foodEl) {
        score += 1;
        scoreEl.textContent = String(score);
        flashAnimal(animals[kind], true);
        spawnHearts(animals[kind]);
        playHappy();
        setHint(hints.yay);
        foodEl.remove();
        activeFood = null;

        if (score > 0 && score % 5 === 0) {
          showCelebrate();
          setTimeout(spawnFood, 1700);
        } else {
          setTimeout(spawnFood, 450);
        }
      }

      function softMiss(targetKind, foodEl) {
        if (targetKind) flashAnimal(animals[targetKind], false);
        playSoftNo();
        // gently return food to a new soft spot
        placeFood(foodEl);
        foodEl.classList.remove("dragging");
        foodEl.style.transform = "";
        setHint(foodEl.dataset.kind === "bunny" ? hints.bunny : hints.dino);
      }

      function tryDrop(foodEl, clientX, clientY) {
        const target = hitTestAnimal(clientX, clientY);
        const kind = foodEl.dataset.kind;
        if (target === kind) {
          successFeed(kind, foodEl);
          return;
        }
        if (target && target !== kind) {
          softMiss(target, foodEl);
          return;
        }
        // drop elsewhere: keep food, nudge position to drop point within stage
        const stageRect = stage.getBoundingClientRect();
        const size = 72;
        let left = clientX - stageRect.left - size / 2;
        let top = clientY - stageRect.top - size / 2;
        left = Math.max(8, Math.min(stageRect.width - size - 8, left));
        top = Math.max(stageRect.height * 0.12, Math.min(stageRect.height * 0.5, top));
        foodEl.style.left = left + "px";
        foodEl.style.top = top + "px";
        foodEl.classList.remove("dragging");
      }

      function bindFood(el) {
        let dragging = false;
        let pointerId = null;
        let offsetX = 0;
        let offsetY = 0;

        function onDown(e) {
          if (!playing || activeFood && activeFood !== el) return;
          e.preventDefault();
          ensureAudio();
          dragging = true;
          activeFood = el;
          pointerId = e.pointerId;
          el.setPointerCapture(pointerId);
          const rect = el.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
          el.classList.add("dragging");
        }

        function onMove(e) {
          if (!dragging || e.pointerId !== pointerId) return;
          e.preventDefault();
          const stageRect = stage.getBoundingClientRect();
          let left = e.clientX - stageRect.left - offsetX;
          let top = e.clientY - stageRect.top - offsetY;
          left = Math.max(-20, Math.min(stageRect.width - 52, left));
          top = Math.max(-20, Math.min(stageRect.height - 52, top));
          el.style.left = left + "px";
          el.style.top = top + "px";

          // soft highlight while hovering matching animal
          const hover = hitTestAnimal(e.clientX, e.clientY);
          kinds.forEach(function (k) {
            animals[k].classList.toggle("glow-ok", hover === k && k === el.dataset.kind);
            animals[k].classList.toggle("glow-no", hover === k && k !== el.dataset.kind);
          });
        }

        function onUp(e) {
          if (!dragging || e.pointerId !== pointerId) return;
          e.preventDefault();
          dragging = false;
          try {
            el.releasePointerCapture(pointerId);
          } catch (err) {}
          pointerId = null;
          kinds.forEach(function (k) {
            animals[k].classList.remove("glow-ok", "glow-no");
          });
          tryDrop(el, e.clientX, e.clientY);
        }

        el.addEventListener("pointerdown", onDown);
        el.addEventListener("pointermove", onMove);
        el.addEventListener("pointerup", onUp);
        el.addEventListener("pointercancel", onUp);
      }

      // also allow tapping an animal when food is nearby / single food present
      function bindAnimalTap(kind) {
        const el = animals[kind];
        el.addEventListener("pointerdown", function (e) {
          if (!playing) return;
          const food = foodLayer.querySelector(".food");
          if (!food) return;
          e.preventDefault();
          ensureAudio();
          if (food.dataset.kind === kind) {
            successFeed(kind, food);
          } else {
            softMiss(kind, food);
          }
        });
      }

      bindAnimalTap("bunny");
      bindAnimalTap("dino");

      function startGame() {
        ensureAudio();
        score = 0;
        scoreEl.textContent = "0";
        playing = true;
        startOverlay.classList.add("hidden");
        againOverlay.classList.add("hidden");
        celebrate.classList.remove("show");
        setHint(hints.both);
        spawnFood();
      }

      startBtn.addEventListener("click", startGame);
      againBtn.addEventListener("click", startGame);

      // optional gentle "again" after long play — never punishing; hideable
      // keep endless; again overlay unused unless parent wants reset via long press score
      scoreEl.parentElement.addEventListener("dblclick", function () {
        if (!playing) return;
        playing = false;
        clearFoods();
        againOverlay.classList.remove("hidden");
      });

      // Prevent page scroll/zoom annoyances on iOS
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("touchmove", function (e) {
        if (e.target.closest && e.target.closest(".food, .animal, .stage")) {
          e.preventDefault();
        }
      }, { passive: false });

      // Keep food on screen after rotate / resize
      window.addEventListener("resize", function () {
        const food = foodLayer.querySelector(".food");
        if (food && !food.classList.contains("dragging")) placeFood(food);
      });
    })();
  </script>
</body>
</html>
